<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIMaker</title>
    <link rel="stylesheet" href="./src/output.css">
    <script src="./javascript/dataFetch.js" defer></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 m-2 flex flex-col min-h-screen transition-all duration-400">
    <header class="flex flex-row items-center justify-between mb-2">
        <h1 class="font-light text-[20px]">
            Weather Dashboard
        </h1>
        <div>
        <button onclick="refresh()" class="cursor-pointer"><svg xmlns="http://www.w3.org/2000/svg" height="24" 
        viewBox="0 0 24 24" width="27">
        <path d="M0 0h24v24H0z" fill="none"/>
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg></button>
    </div>
    </header>

    <div id="search-bar-container" class="bg-gray-300/10 rounded-lg p-2">
        <input id="search-input" type="text" class="text-gray-200 ml-2 w-full" placeholder="Search for country...">
    </div>

    <div class="grid grid-cols-1 grid-rows-auto sm:grid-cols-2">
        <div id="weather" class="">
            <p id="country"></p>
        </div>
    </div>

</body>
</html>
