<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIMaker</title>
    <link rel="stylesheet" href="./src/output.css">
    <script src="./javascript/animations/themeToggle.js" defer></script>
    <script src="./javascript/dataFetch.js" defer></script>
</head>
<body class="bg-[#0f172] flex flex-col min-h-screen transition-all duration-400">
    <div id="header" class="m-2 flex flex-col items-center border-b ronuded-lg border-gray-300 p-2 gap-2 sm:flex-row sm:justify-between transition-all duration-400">
        <img src="./imgs/transparenthorizontallogo.png" class="h-[60px] transition-all duration-400"/>
        <button class="
        bg-sky-200 
        p-1 
        rounded-lg 
        font-light 
        hover:shadow 
        hover:shadow-black 
        hover:shadow-sm 
        cursor-pointer 
        transition-all 
        duration-400
        sm:max-h-[50px] 
        sm:max-w-[170px]
        sm:p-2
        " onclick="darkmodetoggle()">Toggle Dark Mode</button> 
    </div>
    <div id="search-area" class="flex flex-row justify-center mb-2 border-b border-gray-300 transition-all duration-400">
        <div id="search-area-container" class="
        flex 
        flex-row 
        justify-between 
        border
        border-gray-300 
        m-1
        rounded-lg
        w-full
        transition-all duration-400">
            <input type="text" name="search-input" id="search-input-box" class="pl-1 transition-all duration-400 w-full" placeholder="Enter a country...">
            <div class="
            border-l 
            p-0.5
            border-gray-300
            transition-all duration-400">
            <button onclick="fetchData()" class="
            cursor-pointer 
            font-light 
            bg-sky-200 
            rounded-lg
            p-1
            hover:shadow
            hover:shadow-black
            hover:shadow-sm
            transition-all
            duration-400
            ">Search</button>
            </div>
        </div>
    </div>
    <div id="status-bar" class="text-center m-1">
        <p id="success-text" class="text-green-500 hidden">Successfully Searched</p>
        <p id="failure-text" class="text-red-700 hidden">Search failed, please try again!</p>
    </div>

    <div id="search-results-containers" class="w-full flex-grow px-3 sm:px-4 lg:px-8 xl:px-10 2xl:px-12 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6 md:auto-rows-fr items-stretch content-stretch transition-all duration-400">
        
        <div class="search-result-country-info bg-white border rounded-lg border-gray-200 w-full h-auto md:h-full md:min-h-[450px] transition-all duration-400">
            <div id="header" class="bg-gray-300 rounded-t-lg text-center p-2 transition-all duration-400">
                <p class="text-[18px] font-bold transition-all duration-400">Country Info</p>
            </div>
            <div id="flag-image-container" class="flex h-[180px] w-[70%] m-auto transition-all duration-400 sm:h-[160px] sm:w-[55%]">
                <img src="" id="flag-image" class="h-full w-full m-2" >
            </div>
            <div id="country-name" class="border-b border-gray-200 h-[40px] flex flex-row justify-center items-end transition-all duration-400">
                <p id="country-name-result" class="font-bold font-sans transition-all duration-400">
                    Country Name
                </p>
            </div>
            <div id="country-pop" class="transition-all duration-400">
                <p id="population-result" class="text-center m-1 font-light transition-all duration-400">
                    Country Information
                </p>
            </div>
        </div>
            
        <div class="search-result-country-weather bg-white w-full rounded-lg border border-gray-300 h-auto md:h-full md:min-h-[450px] transition-all duration-400">
                <div id="header" class="bg-gray-300 rounded-t-lg text-center p-2 transition-all duration-400">
                <p class="text-[18px] font-bold transition-all duration-400">
                    Country Current Weather
                </p>
            </div>
                <div id="weather-temp-container" class="transition-all duration-400">
                <p id="temp-result" class="font-bold text-[42px] text-center transition-all duration-400">
                    0°F
                </p>
            </div>
                <div id="temp-conversion-toggle-container" class="text-center w-full transition-all duration-400">
                <button onclick="tempConversion()" class="mx-auto w-full bg-sky-200 font-light sm:text-center sm:max-w-[200px] hover:shadow hover:shadow-black cursor-pointer transition-all duration-400">Toggle Conversion</button>
            </div>
                <div id="overall-results-container" class="m-1 transition-all duration-400">
                    <div id="wind-result-container" class="transition-all duration-400">
                <p id="wind-result" class="font-light font-sans transition-all duration-400">
                    Wind:
                </p>
            </div>
                    <div class="humidity-result-container transition-all duration-400">
                <p id="humidity-result" class="transition-all duration-400">
                    Humidity:
                </p>
            </div>
                    <div class="cloud-result-container transition-all duration-400">
                <p id="cloud-result" class="transition-all duration-400">
                    Cloud Cover:
                </p>
            </div>
            </div>
        </div>
        
        <div class="search-result-country-weather bg-white w-full rounded-lg border border-gray-300 h-auto md:h-full md:min-h-[450px] transition-all duration-400">
                <div id="header" class="bg-gray-300 rounded-t-lg text-center p-2 transition-all duration-400">
                <p class="text-[18px] font-bold transition-all duration-400">
                    Country Air Quality
                </p>
            </div>
                <div id="quality-result-container" class="transition-all duration-400">
                <p id="quality-result" class="font-bold text-[42px] text-center transition-all duration-400">
                    RESULT TEXT
                </p>
            </div>
                <div id="overall-results-container" class="m-1 transition-all duration-400">
                    <div id="wind-result-container" class="transition-all duration-400">
                <p id="wind-result" class="font-light font-sans transition-all duration-400">
                    Wind:
                </p>
            </div>
                    <div class="humidity-result-container transition-all duration-400">
                <p id="humidity-result" class="transition-all duration-400">
                    Humidity:
                </p>
            </div>
                    <div class="cloud-result-container transition-all duration-400">
                <p id="cloud-result" class="transition-all duration-400">
                    Cloud Cover:
                </p>
            </div>
            </div>
        </div>
    </div>
    <footer class="bg-slate-200 mt-5 text-center font-light p-2 sm:text-[20px] transition-all duration-400">
        <p>Developed by Daniel Long 2026</p>
    </footer>
</body>
</html>
